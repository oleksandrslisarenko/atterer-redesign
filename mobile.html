<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobile Ansicht – Atterer Redesign</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/fonts.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Archivo',system-ui,sans-serif;background:#E4E9EC;color:#26343B;display:grid;grid-template-columns:320px 1fr;min-height:100vh}
aside{background:#fff;padding:28px 24px;overflow-y:auto;height:100vh;position:sticky;top:0}
a{color:inherit}
.back{font-size:.9rem;text-decoration:none;color:#5C6B73}
.back:hover{color:#0071B7}
h1{font-weight:800;font-style:italic;font-stretch:72%;font-size:1.9rem;line-height:1;margin:18px 0 18px}
.tabs{display:flex;gap:6px;margin-bottom:22px}
.tabs{flex-wrap:wrap}.tabs a{flex:1 1 40%;text-align:center;padding:9px 0;font-weight:700;text-decoration:none;background:#EEF1F3;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);font-size:.92rem}
.tabs a[aria-current]{background:#0071B7;color:#fff}
h2{font-size:.78rem;letter-spacing:.06em;color:#8696A0;font-weight:700;margin:18px 0 6px}
ul{list-style:none;margin:0;padding:0}
li button{all:unset;cursor:pointer;display:block;width:100%;padding:7px 10px;margin-left:-10px;font-size:.95rem;border-radius:3px}
li button:hover{background:#EEF1F3}
li button[aria-current]{background:#0071B7;color:#fff}
main{display:grid;place-items:center;padding:32px}
.phone{width:414px;height:min(880px,calc(100vh - 64px));background:#1B2328;border-radius:56px;padding:52px 12px 14px;box-shadow:0 40px 80px rgba(23,33,39,.35),inset 0 0 0 2px #3b464d;position:relative}
.phone::before{content:"";position:absolute;top:18px;left:50%;translate:-50% 0;width:96px;height:22px;background:#0d1215;border-radius:20px;z-index:2}
iframe{width:390px;height:100%;border:0;border-radius:6px 6px 42px 42px;background:#fff;display:block}
.desk{display:inline-block;margin-top:18px;font-size:.9rem;font-weight:700;color:#0071B7}
@media(max-width:820px){body{display:block}aside{height:auto;position:static}main{padding:16px}.phone{width:100%;max-width:414px}iframe{width:100%}}
</style>
</head>
<body>
<aside>
  <a class="back" href="index.html">← Alle Richtungen</a>
  <h1>Mobile Ansicht</h1>
  <nav class="tabs" id="tabs"></nav>
  <div id="list"></div>
  <a class="desk" id="desk" href="#" target="_blank">Diese Seite in Desktop-Ansicht öffnen</a>
</aside>
<main><div class="phone"><iframe id="f" title="Mobile Vorschau"></iframe></div></main>
<script>
const V={v1:'Biegeplan',v2:'Vier Generationen',v3:'Halle',v4:'Werknorm'};
const G=[
 ['Start',[['index','Startseite']]],
 ['Firma',[['firma','Unsere Geschichte'],['qualitaetsmanagement','Qualitätsmanagement']]],
 ['Produkte',[['produkte','Übersicht'],['bewehrungsstahl','Bewehrungsstahl'],['geschweisste-bewehrungsmodule','Geschweißte Bewehrungsmodule'],['bamtec','BAMTEC®'],['oenorm-stahl','ÖNORM-Stahl'],['bohrpfahl-bewehrungskoerbe','Bohrpfahl-Bewehrungskörbe'],['schweissarbeiten','Schweißarbeiten'],['schalungszubehoer','Schalungszubehör'],['formstahl','Formstahl']]],
 ['Karriere',[['karriere','Übersicht'],['vertriebsinnendienst','Vertriebsinnendienst'],['betonstahlbieger','Betonstahlbieger'],['bohrpfahl-schweisser','Bohrpfahl-Schweißer'],['schlosser','Schlosser'],['ladearbeiter','Ladearbeiter'],['maschinenbediener','Maschinenbediener'],['lkw-fahrer','LKW-Fahrer'],['ausbildung','Ausbildung'],['ausbildung-kaufmann','Kaufmann/-frau Groß- und Außenhandel'],['ausbildung-industriekaufmann','Industriekaufmann/-frau'],['initiativbewerbung','Initiativbewerbung']]],
 ['Service',[['bestellen','So bestellen Sie'],['downloads','Downloads'],['kontakt','Kontakt'],['impressum','Impressum'],['datenschutz','Datenschutz'],['agb','AGB']]],
];
const q=new URLSearchParams(location.search);let v=V[q.get('v')]?q.get('v'):'v1';let p=q.get('p')||'index';
const f=document.getElementById('f');
function render(){
  document.getElementById('tabs').innerHTML=Object.entries(V).map(([k,n],i)=>`<a href="?v=${k}&p=${p}" ${k===v?'aria-current="page"':''}>${i+1}. ${n}</a>`).join('');
  document.getElementById('list').innerHTML=G.map(([h,ps])=>`<h2>${h.toUpperCase()}</h2><ul>${ps.filter(([s])=>s!=='bestellen'||v==='v4').map(([s,n])=>`<li><button data-p="${s}" ${s===p?'aria-current="page"':''}>${n}</button></li>`).join('')}</ul>`).join('');
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{p=b.dataset.p;go()});
  document.getElementById('desk').href=`${v}/${p}.html`;
}
function go(){f.src=`${v}/${p}.html`;history.replaceState(null,'',`?v=${v}&p=${p}`);render()}
f.addEventListener('load',()=>{try{const s=f.contentWindow.location.pathname.split('/').pop().replace('.html','');if(s&&s!==p){p=s;history.replaceState(null,'',`?v=${v}&p=${p}`);render()}}catch(e){}});
go();
</script>
</body></html>
